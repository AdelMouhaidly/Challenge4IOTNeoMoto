services:
  - type: web
    name: mottu-python-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app --host 0.0.0.0 --port $PORT --workers 2 --timeout 120 --worker-class uvicorn.workers.UvicornWorker
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

