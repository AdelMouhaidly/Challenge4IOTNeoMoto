services:
  - type: web
    name: mottu-python-api
    env: python
    branch: challenge4
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --worker-class uvicorn.workers.UvicornWorker --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

